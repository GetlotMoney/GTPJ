<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTPJ 框架历史快照｜UI-FRAMEWORK-SNAPSHOT-V1</title>
  <style>
    :root { --ink:#19283a; --muted:#597087; --line:#8aa2b7; --blue:#e8f3ff; --green:#eaf8f1; --orange:#fff2df; --purple:#f3edff; --red:#fff0ef; --panel:#ffffff; --bg:#f4f8fb; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif; }
    header { padding:28px max(24px,calc((100vw - 1560px)/2)); background:linear-gradient(125deg,#142d47,#244d6b); color:#fff; }
    h1 { margin:0; font-size:30px; letter-spacing:-.4px; }
    header p { margin:8px 0 0; color:#d6e8f5; }
    main { max-width:1600px; margin:22px auto 36px; padding:0 18px; }
    .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
    .chip { border-radius:12px; padding:13px 16px; border:1px solid #d9e3eb; background:var(--panel); }
    .chip b { display:block; font-size:15px; margin-bottom:4px; }
    .chip small { color:var(--muted); line-height:1.5; }
    .stable { border-left:5px solid #32936f; } .active { border-left:5px solid #367ec5; } .research { border-left:5px solid #ce7a42; }
    .canvas { overflow-x:auto; border-radius:16px; box-shadow:0 10px 30px rgba(25,55,82,.10); background:#fff; }
    svg { min-width:1200px; width:100%; height:auto; display:block; }
    .lane { fill:#f8fbfd; stroke:#d7e4ed; stroke-width:1.5; }
    .lane-title { font-size:18px; font-weight:700; fill:#36546d; }
    .node { stroke-width:2; rx:14; ry:14; }
    .n-blue { fill:var(--blue); stroke:#5a9dd4; } .n-green { fill:var(--green); stroke:#4da77d; } .n-orange { fill:var(--orange); stroke:#d99343; } .n-purple { fill:var(--purple); stroke:#9371cd; } .n-red { fill:var(--red); stroke:#d36c62; }
    .title { font-size:18px; font-weight:700; fill:var(--ink); }
    .sub { font-size:14px; fill:#486276; }
    .tiny { font-size:12px; fill:#60778b; }
    .flow { stroke:#5d7e96; stroke-width:3; fill:none; marker-end:url(#arrow); }
    .aux { stroke:#8a6fc1; stroke-width:2.5; fill:none; stroke-dasharray:8 6; marker-end:url(#arrowPurple); }
    .lossline { stroke:#c66f5d; stroke-width:2.5; fill:none; marker-end:url(#arrowRed); }
    .note { font-size:14px; fill:#405c70; }
    .legend { fill:#f7fafc; stroke:#d9e4ec; stroke-width:1.3; rx:10; }
    @media (max-width:760px) { .summary { grid-template-columns:1fr; } h1 { font-size:24px; } header { padding:22px 18px; } }
  </style>
</head>
<body>
  <aside style="padding:12px 18px;background:#fff4d8;border-bottom:2px solid #d99343;color:#5f461f;line-height:1.6;">
    <strong>历史快照：</strong>本页保存 2026-08-04 当时的框架说明，不再作为当前入口。
    当前正式框架、母版和四类实验状态请打开
    <a href="../GTPJ_FRAMEWORK_REGISTRY_UI-V3.html">UI-FRAMEWORK-REGISTRY-V3</a>。

  <header>
    <h1>GTPJ 框架图历史快照</h1>
    <p>UI-FRAMEWORK-SNAPSHOT-V1｜记录日期 2026-08-04｜保留当时的 v5 路径、“稳定参考”和“高分线索”。</p>
  </header>
  <main>
    <section class="summary" aria-label="当前结论">
      <div class="chip stable"><b>最稳参考：v3</b><small>已确认 H=74.47。它是判断新结果是否真正变好的基准。</small></div>
      <div class="chip active"><b>当前在用：v5</b><small>后续调参从 v5 配置出发；5 次固定复跑平均 H=74.44。</small></div>
      <div class="chip research"><b>最高单次：动态路由</b><small>H=75.11，但 5 次原样复跑平均 H=74.58，尚不能升级为稳定框架。</small></div>
    </section>

        <rect class="lane" x="25" y="30" width="1750" height="575" rx="18"/>

        <rect x="55" y="635" width="1690" height="180" rx="18" fill="#faf8ff" stroke="#d8c9f2" stroke-width="1.5"/>
        <text class="lane-title" x="82" y="675">研究分支：动态路由试验（不是当前稳定框架）</text>
        <text class="note" x="82" y="705">它只给 v5 已有的数值“自动调节大小”，不改数据划分、类别顺序、分数计算或最终分数形状。</text>
        <rect class="node n-purple" x="145" y="730" width="220" height="58"/><text class="title" x="181" y="765">PSE 门控</text><text class="tiny" x="262" y="765">文本残差强度</text>
