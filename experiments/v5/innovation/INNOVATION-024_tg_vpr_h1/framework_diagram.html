<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>TG-VPR-H1 框架</title>
  <style>
    body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#f5f7fb;color:#172033;margin:0;padding:40px}
    main{max-width:1100px;margin:auto;background:white;border-radius:18px;padding:32px;box-shadow:0 12px 36px #20305018}
    .flow{display:flex;align-items:stretch;gap:14px;flex-wrap:wrap}.box{border:1px solid #cbd5e1;border-radius:12px;padding:16px;min-width:150px;flex:1;background:#f8fafc}
    .main{background:#eef2ff;border-color:#818cf8}.out{background:#ecfdf5;border-color:#34d399}.arrow{align-self:center;font-size:28px;color:#64748b}
    code{background:#eef2f7;padding:2px 6px;border-radius:5px}.note{margin-top:24px;padding:16px;background:#fff7ed;border-radius:12px}
  </style>
</head>
<body><main>
  <h1>TG-VPR-H1：三组 Value 原型重参数化</h1>
  <div class="flow">
    <div class="box">六个局部描述<br>组内平均</div><div class="box">独特描述</div><div class="box">整体描述</div>
    <div class="arrow">→</div><div class="box main">单一 768 维 Value 路径<br>无 Q/K attention</div>
    <div class="arrow">→</div><div class="box main">内层与外层双残差</div>
    <div class="arrow">→</div><div class="box out">seen 类原型<br>200 类余弦分类</div>
  </div>
  <div class="note"><strong>unseen 边界：</strong>unseen 类始终保持 Mean8；U/S/H 在200类空间竞争，ZS在50个unseen类空间竞争。</div>
</main></body></html>
